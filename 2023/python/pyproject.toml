[project]
name = "pyadvent23"
version = "0.0.1"
description = "Default template for PDM package"
authors = [
    {name = "cruz13", email = "..."},
]
dependencies = [
    "httpx>=0.27.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
getinput = "python tools/get_inputs.py {args}"

[tool.pdm.dev-dependencies]
lint = [
    "ruff>=0.5.7",
    "black>=24.8.0",
]
test = [
    "pytest>=8.3.2",
]
